  - delay: 100ms
  - set-control: {part-id: k0, name: pressed, value: 1}
  - delay: 100ms
  - set-control: {part-id: k0, name: pressed, value: 0}
  - delay: 100ms
  - set-control: {part-id: k0, name: pressed, value: 1}
  - delay: 100ms
  - set-control: {part-id: k0, name: pressed, value: 0}
  - delay: 100ms
  - set-control: {part-id: k0, name: pressed, value: 1}
  - delay: 100ms
  - set-control: {part-id: k0, name: pressed, value: 0}
  - delay: 100ms
  - set-control: {part-id: kH, name: pressed, value: 1}
