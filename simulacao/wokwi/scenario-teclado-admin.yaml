  - delay: 100ms
  - set-control: {part-id: kD, name: pressed, value: 0}
  - delay: 100ms
  - delay: 300ms
  - expect-pin: {part-id: mega, name: 32, value: 0}
  - expect-pin: {part-id: mega, name: 33, value: 0}
