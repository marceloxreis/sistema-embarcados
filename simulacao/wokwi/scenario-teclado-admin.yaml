# Entra no menu admin com 0 x10 + # e cancela com D. Usar com diagram-teclado-botoes.json.
name: "Teclado: admin e cancelamento"
version: 1
author: controle-acesso-esp32
steps:
  - wait-serial: "BOOT boot="
  - delay: 500ms
  - set-control: {part-id: k0, name: pressed, value: 1}
  - delay: 100ms
  - set-control: {part-id: k0, name: pressed, value: 0}
  - delay: 100ms
  - set-control: {part-id: k0, name: pressed, value: 1}
  - delay: 100ms
  - set-control: {part-id: k0, name: pressed, value: 0}
  - delay: 100ms
